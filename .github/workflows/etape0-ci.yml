name: etape0-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SECRETS - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Installer les dependances
        run: pip install -r app/requirements.txt pytest

      - name: TESTER
        run: pytest -q app/tests

      - name: SCA - Trivy (dependances)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: app/
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: CONSTRUIRE l'image
        run: docker build -f docker/Dockerfile -t flask-demo:${{ github.sha }} .

      - name: SCAN IMAGE - Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flask-demo:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
