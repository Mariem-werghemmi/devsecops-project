name: etape0-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SECRETS - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Installer les dependances
        run: pip install -r app/requirements.txt pytest

      - name: TESTER
        run: pytest -q app/tests

      - name: Installer Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: SCA - Trivy (dependances)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 app/

      - name: CONSTRUIRE l'image
        run: docker build -f docker/Dockerfile -t flask-demo:${{ github.sha }} .

      - name: SCAN IMAGE - Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 flask-demo:${{ github.sha }}
